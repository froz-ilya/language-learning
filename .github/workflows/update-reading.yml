name: Update reading list

# Monthly: asks MiniKlexikon/Klexikon what changed since the catalog was last synced (a handful
# of API requests), re-rates new/edited articles and opens a pull request on bot/update-reading.
# Never pushes to main: merging the pull request deploys (deploy.yml).
on:
  schedule:
    - cron: '17 4 3 * *' # 04:17 UTC on the 3rd of every month
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-reading
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      BRANCH: bot/update-reading
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Update the catalog from the sites' recent changes
        run: npm run data:klexikon -- --summary="$RUNNER_TEMP/summary"

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- public/reading/klexikon.json src/lib/reading/sources/klexikon-levels.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes: nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        if: steps.diff.outputs.changed == 'true'
        run: npm test

      - name: Open or update the pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="$(cat "$RUNNER_TEMP/summary/title.txt")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$BRANCH"
          git add public/reading/klexikon.json src/lib/reading/sources/klexikon-levels.json
          git commit -m "$title" -m "$(cat "$RUNNER_TEMP/summary/body.md")"
          # The branch always starts from main, so an unmerged older update is simply replaced.
          git push --force origin "$BRANCH"
          number="$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')"
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body-file "$RUNNER_TEMP/summary/body.md"
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/summary/body.md"
          fi
