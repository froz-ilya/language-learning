<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="c"><rect width="512" height="512" rx="112"/></clipPath>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.12"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#c)">
    <!-- The German flag: black, red, gold -->
    <rect width="512" height="171" fill="#16161a"/>
    <rect y="171" width="512" height="171" fill="#dd2a1e"/>
    <rect y="342" width="512" height="170" fill="#ffcc1a"/>
    <rect width="512" height="512" fill="url(#sheen)"/>
  </g>
  <!-- A friendly "ü": the umlaut dots are eyes, the u is a smile -->
  <circle cx="190" cy="98" r="36" fill="#fff"/>
  <circle cx="322" cy="98" r="36" fill="#fff"/>
  <path d="M190 206v40a66 66 0 0 0 132 0v-40" fill="none" stroke="#fff" stroke-width="54" stroke-linecap="round"/>
